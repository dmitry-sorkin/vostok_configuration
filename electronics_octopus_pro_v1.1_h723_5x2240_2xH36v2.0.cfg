# Базовая конфигурация VOSTOK v9.x
# ------------------------
# Файл распространяется под лицензией CC-BY 4.0
# ------------------------
#
# Плата: BigTreeTech Octopus Pro v1.1 H723
# Коммутационные платы: 2x Fysetc H36 v2.0
# Драйверы: 5x tmc2240
# Датчик автоуровня: BTT Microprobe
# Доп.оборудование: нет
#
# Коммутационные платы подключаются по CAN. Секции в printer.cfg
# должны называться [mcu T0CB] и [mcu T1CB] для левой и правой
# печатающей головы соответственно
#
#--------------------------------------------------------
#          Оборудование             |      Разъём       |
#-----------------------------------|-------------------|
# Мотор оси X                       | MOTOR2            |
# Мотор оси W                       | MOTOR0            |
# Левый мотор оси Y                 | MOTOR3            |
# Правый мотор оси Y                | MOTOR1            |
# Мотор оси Z                       | MOTOR7            |
# Мотор фидера левой головы         | T0CB:MOTOR        |
# Мотор фидера правой головы        | T1CB:MOTOR        |
# Нагреватель левой головы          | T0CB:HE0          |
# Нагреватель правой головы         | T1CB:HE0          |
# Нагреватель стола                 | HE2               |
# Термистор левой головы            | T0CB:TE0          |
# Термистор правой головы           | T1CB:TE0          |
# Термистор стола                   | TB                |
# Охлаждение хотэнда левой головы   | T0CB:Fan2         |
# Охлаждение хотэнда правой головы  | T1CB:Fan2         |
# Охлаждение модели                 | RGB               |
# Охлаждение отсека электроники     | FAN3              |
# Концевик оси X                    | T0CB:IO2          |
# Концевик оси W                    | T1CB:IO2          |
# Концевик оси Y левый              | STOP0             |
# Концевик оси Y правый             | STOP1             |
# Датчик автоуровня                 | T0CB:IO0+1        |
#--------------------------------------------------------

#########################################################
# Двигатели
#########################################################

[stepper motor_x]			#MOTOR2  
step_pin: PF11
dir_pin: !PG3
enable_pin: !PG5
full_steps_per_rotation: 200

[stepper motor_w]			#MOTOR0 
step_pin: PF13
dir_pin: !PF12
enable_pin: !PF14
full_steps_per_rotation: 200

[stepper motor_yl]			#MOTOR3 
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA2
full_steps_per_rotation: 200

[stepper motor_yr]			#MOTOR1 
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
full_steps_per_rotation: 200

[stepper motor_z]			#MOTOR7
step_pin: PE6
dir_pin: !PA14
enable_pin: !PE0
full_steps_per_rotation: 200

[extruder]
step_pin: T0CB:PB9			#TMC2209_STEP
dir_pin: !T0CB:PC15			#TMC2209_DIR
enable_pin: !T0CB:PC14		#TMC2209_ENN
full_steps_per_rotation: 200

[extruder1]
step_pin: T1CB:PB9			#TMC2209_STEP
dir_pin: T1CB:PC15			#TMC2209_DIR
enable_pin: !T1CB:PC14		#TMC2209_ENN
full_steps_per_rotation: 200

#########################################################
# Драйверы
#########################################################

[tmc2240 stepper motor_x]	#MOTOR2
cs_pin: PC6
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
run_current: 1.2
stealthchop_threshold: 0
interpolate: False

[tmc2240 stepper motor_w]	#MOTOR0 
cs_pin: PC4
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
run_current: 1.2
stealthchop_threshold: 0
interpolate: False

[tmc2240 stepper motor_yl]	#MOTOR3 
cs_pin: PC7
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
run_current: 1.2
stealthchop_threshold: 0
interpolate: False

[tmc2240 stepper motor_yr]	#MOTOR1 
cs_pin: PD11
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
run_current: 1.2
stealthchop_threshold: 0
interpolate: False

[tmc2240 stepper motor_z]	#MOTOR7
cs_pin: PD3
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
run_current: 1.2
stealthchop_threshold: 999999
interpolate: True

[tmc2209 extruder]
uart_pin: T0CB:PB6			#TMC2209_RX
interpolate: false
run_current: 0.7
sense_resistor: 0.110
stealthchop_threshold: 0

[tmc2209 extruder1]
uart_pin: T1CB:PB6			#TMC2209_RX
interpolate: false
run_current: 0.7
sense_resistor: 0.110
stealthchop_threshold: 0

#########################################################
# Концевики и датчик автоуровня
#########################################################

[carriage xc]
endstop_pin: ^T0CB:PB5		#IO.2

[dual_carriage wc]
endstop_pin: ^T1CB:PB5		#IO.2

[carriage ylc]
endstop_pin: ^PG6			#STOP0

[extra_carriage yrc]
endstop_pin: ^PG9			#STOP1

[probe]
pin: ^!T0CB:PB4				#IO.1

[output_pin probe_enable]
pin: T0CB:PB3				#IO.0
value: 0

[gcode_macro PROBE_DEPLOY]
gcode:
    SET_PIN PIN=probe_enable VALUE=1

[gcode_macro PROBE_STOW]
gcode:
    SET_PIN PIN=probe_enable VALUE=0

#########################################################
# Нагреватели и термисторы
#########################################################

[extruder]
heater_pin: T0CB:PB13		#Heater
sensor_pin: T0CB:PA3		#TE0
pullup_resistor: 2200

[extruder1]
heater_pin: T1CB:PB13		#Heater
sensor_pin: T1CB:PA3		#TE0
pullup_resistor: 2200

[heater_bed]
heater_pin: PB0				#HE2
sensor_pin: PF3				#TB

#########################################################
# Вентиляторы
#########################################################

[fan]
pin: PB10					#RGB

[heater_fan e0_fan]
pin: T0CB:PB0				#T0CB FAN2

[heater_fan e1_fan]			
pin: T1CB:PB0				#T1CB FAN2

[controller_fan electronics_fan]
pin: PD13					#FAN3

#########################################################
# Акселерометры
#########################################################

[adxl345 t0_accelerometer]
cs_pin: T0CB:PA4
spi_software_sclk_pin: T0CB:PA5			#ADXL_SCK
spi_software_mosi_pin: T0CB:PA7			#ADXL_MOSI
spi_software_miso_pin: T0CB:PA6			#ADXL_MISO
axes_map: -y,z,-x
rate: 1600					# Снижает частоту опроса с 3200 до 1600 Гц
spi_speed: 1000000				# Снижает частоту SPI до стабильного 1 МГц

[adxl345 t1_accelerometer]
cs_pin: T1CB:PA4
spi_software_sclk_pin: T1CB:PA5			#ADXL_SCK
spi_software_mosi_pin: T1CB:PA7			#ADXL_MOSI
spi_software_miso_pin: T1CB:PA6			#ADXL_MISO
axes_map: -y,z,-x
rate: 1600					# Снижает частоту опроса с 3200 до 1600 Гц
spi_speed: 1000000				# Снижает частоту SPI до стабильного 1 МГц

[resonance_tester]
accel_chip: adxl345 t1_accelerometer
probe_points:
    200,125,20

#########################################################
# Состояние электроники
#########################################################

[temperature_sensor CB2]
sensor_type: temperature_host

[temperature_sensor Octopus]
sensor_type: temperature_mcu

[temperature_sensor T0CB_mcu]
sensor_type: temperature_mcu
sensor_mcu: T0CB
min_temp: 0
max_temp: 150

[temperature_sensor T0CB_driver]
sensor_type: Generic 3950
sensor_pin: T0CB:PA0					#T_DR
min_temp:0
max_temp:150

[temperature_sensor T1CB_mcu]
sensor_type: temperature_mcu
sensor_mcu: T1CB
min_temp: 0
max_temp: 150

[temperature_sensor T1CB_driver]
sensor_type: Generic 3950
sensor_pin: T1CB:PA0					#T_DR
min_temp:0
max_temp:150